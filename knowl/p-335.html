<p>If \(\vec{b} \notin A\) then</p>
\begin{equation*}
A′ = \{ \vec{b} + t_1 \vec{v_1} + t_2 \vec{v_2} | t_1,t_2 \in \mathbb{R} \}
\end{equation*}
<p>which is a plane <em class="emphasis">not</em> through the origin, and so is not a subspace.</p>
