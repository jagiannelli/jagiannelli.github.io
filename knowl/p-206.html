<p>The <tt class="code-inline tex2jax_ignore">derivative(y,x)</tt> is a Sage <em class="emphasis">method</em> that is passed a <em class="emphasis">function</em>, in this case \(y\text{.}\) Of course, this has been defined above as \(y(x)\text{.}\) The <tt class="code-inline tex2jax_ignore">derivative()</tt> method also takes one or more additional arguments for the equation variable, in this case \(x\text{.}\)</p>
