\begin{align*}
\fe{f''}{x}&amp;=\lim_{h \to 0} \frac{\fe{f'}{x} - \fe{f'}{x-h}}{h}\\
&amp;=\lim_{h \to 0}\frac{\frac{f(x+h)-f(x)}{h}-\frac{f(x)-f(x-h)}{h}}{h}\\
&amp;=\lim_{h \to 0}\frac{f(x+h)-2f(x)+f(x-h)}{h^2}
\end{align*}
