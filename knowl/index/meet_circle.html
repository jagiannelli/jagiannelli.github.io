<div class="para">The real points where a circle and a line meet: solve the two equations together and throw away any complex solutions.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#meet_circle-3-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> <div id="meet_circle-3-2" class="ptx-sagecell sagecell-sage"><script type="text/x-sage">def meet_circle(circle_eq, line_eq):
    points = []
    for s in solve([circle_eq, line_eq], x, y):
        p, q = s[0].rhs(), s[1].rhs()
        if p.imag() == 0 and q.imag() == 0:
            points.append((p, q))
    return points
</script></div>
