<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.2.4</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Utility methods <code class="code-inline tex2jax_ignore">signed_term()</code> and <code class="code-inline tex2jax_ignore">circle_text()</code>.</span>
</h2>
<div class="para">Sage prints <code class="code-inline tex2jax_ignore">(x - 3)^2 + (y + 2)^2 == 25</code>, which is fine for checking but not how we would write it. These two build the text of a circle’s equation in both of its usual forms.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#circle_text-3-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> <div id="circle_text-3-2" class="ptx-sagecell sagecell-sage"><script type="text/x-sage">def signed_term(coefficient, letter, first=False):
    if coefficient == 0:
        return ""
    size = abs(coefficient)
    if size == 1 and letter:
        body = letter
    elif size in ZZ or not letter:
        body = f"{size}{letter}"
    else:
        body = f"({size}){letter}"
    if first:
        return body if coefficient > 0 else f"-{body}"
    return f" + {body}" if coefficient > 0 else f" - {body}"

def circle_text(centre, r2):
    a, b = centre
    bracket_x = "x²" if a == 0 else f"(x{signed_term(-a, '')})²"
    bracket_y = "y²" if b == 0 else f"(y{signed_term(-b, '')})²"
    expanded = ("x² + y²" + signed_term(-2*a, "x") + signed_term(-2*b, "y")
                + signed_term(a**2 + b**2 - r2, ""))
    return f"{bracket_x} + {bracket_y} = {r2}", expanded + " = 0"
</script></div>
