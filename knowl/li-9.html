<article class="listitem"><h6 class="heading"><span class="type">Item</span></h6>\(y = function('y')(t)\) tells Sage that \(y\) is a function of \(t\text{,}\) e.g. as though every time we type \(y\) we mean \(y(t)\text{.}\) This is a way to identify \(y\) as a function, not just a variable, and associate it with \(t\text{.}\)</article><span class="incontext"><a href="section-6.html#li-9">in-context</a></span>
